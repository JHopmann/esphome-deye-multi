substitutions:
  nameprefix: ""   # No Prefix (Single-Inverter)
  prefix: ""       # No Prefix (Single-Inverter)
  
sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}PV1 Power"
    id: "${prefix}pv1_power"
    register_type: holding
    device_id: ${device_id}
    address: 186
    unit_of_measurement: "W"
    device_class: power
    state_class: "measurement"
    accuracy_decimals: 0
    value_type: U_WORD
    icon: "mdi:solar-power-variant"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}PV2 Power"
    id: "${prefix}pv2_power"
    register_type: holding
    device_id: ${device_id}
    address: 187
    unit_of_measurement: "W"
    device_class: power
    state_class: "measurement"
    accuracy_decimals: 0
    value_type: U_WORD
    icon: "mdi:solar-power-variant"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}PV3 Power"
    id: "${prefix}pv3_power"
    register_type: holding
    device_id: ${device_id}
    address: 188
    unit_of_measurement: "W"
    device_class: power
    state_class: "measurement"
    accuracy_decimals: 0
    value_type: U_WORD
    icon: "mdi:solar-power-variant"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}PV4 Power"
    id: "${prefix}pv4_power"
    register_type: holding
    device_id: ${device_id}
    address: 189
    unit_of_measurement: "W"
    device_class: power
    state_class: "measurement"
    accuracy_decimals: 0
    value_type: U_WORD
    icon: "mdi:solar-power-variant"

  - platform: template
    name: "${nameprefix}PV Power"
    unit_of_measurement: "W"
    id: "${prefix}pv_power"
    device_id: ${device_id}
    device_class: power
    state_class: "measurement"
    accuracy_decimals: 0
    update_interval: 10s
    icon: "mdi:solar-power-variant"
    lambda: |-
      float pv1 = isnan(id(${prefix}pv1_power).state) ? 0.0 : id(${prefix}pv1_power).state;
      float pv2 = isnan(id(${prefix}pv2_power).state) ? 0.0 : id(${prefix}pv2_power).state;
      float pv3 = isnan(id(${prefix}pv3_power).state) ? 0.0 : id(${prefix}pv3_power).state;
      float pv4 = isnan(id(${prefix}pv4_power).state) ? 0.0 : id(${prefix}pv4_power).state;
      return pv1 + pv2 + pv3 +pv4;

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}PV1 Voltage"
    register_type: holding
    device_id: ${device_id}
    address: 109
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    value_type: U_WORD
    icon: "mdi:solar-power-variant"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}PV1 Current"
    register_type: holding
    device_id: ${device_id}
    address: 110
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    value_type: U_WORD
    icon: "mdi:solar-power-variant"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}PV2 Voltage"
    register_type: holding
    device_id: ${device_id}
    address: 111
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    value_type: U_WORD
    icon: "mdi:solar-power-variant"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}PV2 Current"
    register_type: holding
    device_id: ${device_id}
    address: 112
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    value_type: U_WORD
    icon: "mdi:solar-power-variant"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}PV3 Voltage"
    register_type: holding
    device_id: ${device_id}
    address: 113
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    value_type: U_WORD
    icon: "mdi:solar-power-variant"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}PV3 Current"
    register_type: holding
    device_id: ${device_id}
    address: 114
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    value_type: U_WORD
    icon: "mdi:solar-power-variant"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}PV4 Voltage"
    register_type: holding
    device_id: ${device_id}
    address: 115
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    value_type: U_WORD
    icon: "mdi:solar-power-variant"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}PV4 Current"
    register_type: holding
    device_id: ${device_id}
    address: 116
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    value_type: U_WORD
    icon: "mdi:solar-power-variant"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Daily PV Production"
    id: "${prefix}daily_pv_production"
    register_type: holding
    device_id: ${device_id}
    address: 108
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    value_type: U_WORD
    icon: "mdi:solar-power"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Total PV Production"
    id: "${prefix}total_pv_production"
    device_id: ${device_id}
    register_type: holding
    address: 96
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    accuracy_decimals: 1
    value_type: U_DWORD_R
    filters:
      - multiply: 0.1
    icon: "mdi:solar-power"
