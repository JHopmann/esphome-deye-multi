substitutions:
  nameprefix: ""   # No Prefix (Single-Inverter)
  prefix: ""       # No Prefix (Single-Inverter)

sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Daily Battery Charge"
    id: "${prefix}daily_battery_charge"
    device_id: ${device_id}
    register_type: holding
    address: 70
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    value_type: U_WORD
    icon: "mdi:battery-charging"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Daily Battery Discharge"
    id: "${prefix}daily_battery_discharge"
	device_id: ${device_id}
    register_type: holding
    address: 71
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    value_type: U_WORD
    icon: "mdi:battery-minus"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Total Battery Charge"
    id: "${prefix}total_battery_charge"
	device_id: ${device_id}
    register_type: holding
    address: 72
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    accuracy_decimals: 1
    value_type: U_DWORD_R
    filters:
      - multiply: 0.1
    icon: "mdi:battery-charging-100"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Total Battery Discharge"
    id: "${prefix}total_battery_discharge"
	device_id: ${device_id}
    register_type: holding
    address: 74
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    accuracy_decimals: 1
    value_type: U_DWORD_R
    filters:
      - multiply: 0.1
    icon: "mdi:battery-arrow-down"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Battery Temperature"
	device_id: ${device_id}
    register_type: holding
    address: 182
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 0
    value_type: S_WORD
    filters:
      - offset: -1000
      - multiply: 0.1
    icon: "mdi:thermometer"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Battery Voltage"
    id: "${prefix}battery_voltage"
	device_id: ${device_id}
    register_type: holding
    address: 183
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    value_type: U_WORD
    icon: "mdi:flash"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Battery"
	device_id: ${device_id}
    register_type: holding
    address: 184
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    value_type: U_WORD
    icon: "mdi:battery"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Battery Power"
    id: "${prefix}battery_power"
	device_id: ${device_id}
    register_type: holding
    address: 190
    unit_of_measurement: "W"
    device_class: power
    state_class: "measurement"
    accuracy_decimals: 0
    value_type: S_WORD
    icon: "mdi:lightning-bolt"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Battery Current"
	device_id: ${device_id}
    register_type: holding
    address: 191
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    value_type: S_WORD
    icon: "mdi:current-dc"

select:
  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Battery Operation Mode"
    id: "${prefix}battery_operation_mode"
	device_id: ${device_id}
    address: 213
    value_type: U_WORD
    entity_category: config
    icon: "mdi:battery-check"
    optionsmap:
      "Voltage": 0
      "Capacity (%)": 1
      "No battery": 2

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Battery BMS Type"
	device_id: ${device_id}
    address: 325
    value_type: U_WORD
    icon: "mdi:battery-charging-high"
    entity_category: config
    optionsmap:
      "PYLON": 0
      "Tianbangda": 1
      "KOK": 2
      "Keith": 3
      "Toppai": 4
      "Peneng 485": 5
      "Jeris 485": 6
      "Sunwoda 485": 7
      "Xinrui 485": 8
      "Tianbangda 485": 9
      "Shenggao Electric CAN": 10

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Battery Type"
    id: "${prefix}battery_type"
	device_id: ${device_id}
    address: 200
    value_type: U_WORD
    entity_category: config
    icon: "mdi:battery-check"
    optionsmap:
      "AGM": 0
      "Lithium": 1

switch:
  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Battery Wake Up"
	device_id: ${device_id}
    register_type: holding
    address: 214
    bitmask: 1 # Bit0: Battery 1 wake up (0=enabled, 1=disabled)
    entity_category: config
    icon: "mdi:battery-charging"

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Battery Generator Charging"
	device_id: ${device_id}
    register_type: holding
    address: 231
    bitmask: 1
    entity_category: config
    icon: "mdi:battery"

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Battery Grid Charging"
	device_id: ${device_id}
    register_type: holding
    address: 232
    bitmask: 1
    entity_category: config
    icon: "mdi:battery"

number:
  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Battery Generator Charging Start Voltage"
	device_id: ${device_id}
    address: 225
    unit_of_measurement: "V"
    device_class: voltage
    value_type: U_WORD
    multiply: 100
    min_value: 0
    max_value: 63
    step: 0.01
    entity_category: config
    mode: box
    icon: "mdi:battery"

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Battery Generator Charging Start SOC"
	device_id: ${device_id}
    address: 226
    unit_of_measurement: "%"
    value_type: U_WORD
    min_value: 0
    max_value: 100
    step: 1
    entity_category: config
    mode: box
    icon: "mdi:battery"

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Battery Generator Charging Current"
	device_id: ${device_id}
    address: 227
    unit_of_measurement: "A"
    device_class: current
    value_type: U_WORD
    min_value: 0
    max_value: 240
    step: 1
    entity_category: config
    mode: box
    icon: "mdi:current-dc"

  - platform: modbus_controller
    use_write_multiple: true
