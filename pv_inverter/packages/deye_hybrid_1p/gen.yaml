substitutions:
  nameprefix: ""   # No Prefix (Single-Inverter)
  prefix: ""       # No Prefix (Single-Inverter)

sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Daily Generator Production"
    id: "${prefix}daily_generator_production"
	device_id: ${device_id}
    register_type: holding
    address: 62
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    value_type: U_WORD
    icon: "mdi:generator-portable"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Total Generator Production"
    id: "${prefix}total_generator_production"
	device_id: ${device_id}
    register_type: holding
    address: 92
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    accuracy_decimals: 1
    value_type: U_DWORD_R
    filters:
      - multiply: 0.1
    icon: "mdi:generator-stationary"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Generator L1 Voltage"
    id: "${prefix}generator_l1_voltage"
	device_id: ${device_id}
    register_type: holding
    address: 181
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    value_type: U_WORD
    icon: "mdi:lightning-bolt"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Generator Frequency"
	device_id: ${device_id}
    register_type: holding
    address: 196
    unit_of_measurement: "Hz"
    device_class: frequency
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    value_type: U_WORD
    icon: "mdi:engine"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Generator Power Total"
    id: "${prefix}generator_power_total"
	device_id: ${device_id}
    register_type: holding
    address: 166
    unit_of_measurement: "W"
    device_class: power
    state_class: "measurement"
    accuracy_decimals: 0
    value_type: S_WORD
    icon: "mdi:engine"

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Generator Connected Status"
    id: "${prefix}generator_connected_status"
	device_id: ${device_id}
    register_type: holding
    address: 195
    device_class: running
    icon: "mdi:power"

select:
  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Generator Port Use"
    address: 235
    value_type: U_WORD
    entity_category: config
    icon: "mdi:connection"
    optionsmap:
      "Generator Input": 0
      "SmartLoad Output": 1
      "Micro Inverter Input": 2

switch:
  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Generator"
    id: "${prefix}switch_generator"
	device_id: ${device_id}
    register_type: holding
    address: 234
    bitmask: 1
    entity_category: config
    icon: mdi:toggle-switch

number:
  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}SmartLoad Off Voltage"
	device_id: ${device_id}
    address: 236
    unit_of_measurement: "V"
    device_class: voltage
    value_type: U_WORD
    multiply: 100
    min_value: 38
    max_value: 63
    step: 0.01
    entity_category: config
    mode: box
    icon: "mdi:lightning-bolt-circle"

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}SmartLoad Off SOC"
	device_id: ${device_id}
    address: 237
    unit_of_measurement: "%"
    value_type: U_WORD
    min_value: 0
    max_value: 100
    step: 1
    entity_category: config
    mode: box
    icon: "mdi:lightning-bolt-circle"

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}SmartLoad On Voltage"
	device_id: ${device_id}
    address: 238
    unit_of_measurement: "V"
    device_class: voltage
    value_type: U_WORD
    multiply: 100
    min_value: 38
    max_value: 63
    step: 0.01
    entity_category: config
    mode: box
    icon: "mdi:lightning-bolt-circle"

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}SmartLoad On SOC"
	device_id: ${device_id}
    address: 239
    unit_of_measurement: "%"
    value_type: U_WORD
    min_value: 0
    max_value: 100
    step: 1
    entity_category: config
    mode: box
    icon: "mdi:lightning-bolt-circle"

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Generator Operating Time"
    id: "${prefix}generator_operating_time"
    unit_of_measurement: "h"
    device_class: duration
    entity_category: config
	device_id: ${device_id}
    register_type: holding
    min_value: 0
    max_value: 24
    step: 1
    address: 223
    value_type: U_WORD
    mode: box
    icon: "mdi:generator-stationary"

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Generator Cooling Time"
    id: "${prefix}generator_cooling_time"
    unit_of_measurement: "h"
    device_class: duration
    entity_category: config
	device_id: ${device_id}
    register_type: holding
    min_value: 0
    max_value: 24
    step: 1
    address: 224
    value_type: U_WORD
    mode: box
    icon: "mdi:generator-stationary"

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Generator Min PV Power"
    id: "${prefix}generator_min_pv_power"
    unit_of_measurement: "W"
    device_class: power
    entity_category: config
	device_id: ${device_id}
    register_type: holding
    min_value: 0
    max_value: 8000
    step: 1
    address: 241
    value_type: U_WORD
    mode: box
    icon: "mdi:solar-power"
