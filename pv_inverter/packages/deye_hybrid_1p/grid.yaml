substitutions:
  nameprefix: ""   # No Prefix (Single-Inverter)
  prefix: ""       # No Prefix (Single-Inverter)
  
globals:
  - id: "${prefix}last_total_energy_bought"
    type: float
    restore_value: yes
  - id: "${prefix}last_update_time"
    type: unsigned long
    restore_value: yes

sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Grid L1 Power"
    device_id: ${device_id}
    register_type: holding
    address: 167
    unit_of_measurement: "W"
    device_class: power
    state_class: "measurement"
    accuracy_decimals: 0
    value_type: S_WORD
    icon: "mdi:transmission-tower"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Grid L2 Power"
    device_id: ${device_id}
    register_type: holding
    address: 168
    unit_of_measurement: "W"
    device_class: power
    state_class: "measurement"
    accuracy_decimals: 0
    value_type: S_WORD
    icon: "mdi:transmission-tower"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Grid Power"
    device_id: ${device_id}
    register_type: holding
    address: 169
    unit_of_measurement: "W"
    device_class: power
    state_class: "measurement"
    accuracy_decimals: 0
    value_type: S_WORD
    icon: "mdi:transmission-tower"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Grid Frequency"
    device_id: ${device_id}
    register_type: holding
    address: 79
    unit_of_measurement: "Hz"
    device_class: frequency
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    value_type: U_WORD
    icon: "mdi:sine-wave"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Grid L1 Voltage"
    id: "${prefix}grid_voltage_l1"
    device_id: ${device_id}
    register_type: holding
    address: 150
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    value_type: U_WORD
    icon: "mdi:sine-wave"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Grid L2 Voltage"
    id: "${prefix}grid_voltage_l2"
    device_id: ${device_id}
    register_type: holding
    address: 151
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    value_type: U_WORD
    icon: "mdi:sine-wave"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Grid Voltage"
    id: "${prefix}grid_voltage"
    device_id: ${device_id}
    register_type: holding
    address: 152
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    value_type: U_WORD
    icon: "mdi:sine-wave"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Daily Energy Bought"
    id: "${prefix}daily_energy_bought"
    device_id: ${device_id}
    register_type: holding
    address: 76
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    accuracy_decimals: 1
    value_type: U_WORD
    filters:
      - multiply: 0.1
    icon: "mdi:transmission-tower-import"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Daily Energy Sold"
    id: "${prefix}daily_energy_sold"
    device_id: ${device_id}
    register_type: holding
    address: 77
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    accuracy_decimals: 1
    value_type: U_WORD
    filters:
      - multiply: 0.1
    icon: "mdi:transmission-tower-export"

  # Axiliary sensor
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    id: "${prefix}total_energy_bought_low_bytes"
    address: 78
    device_id: ${device_id}
    register_type: holding
    value_type: U_WORD
    internal: true

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    id: "${prefix}total_energy_bought_high_bytes"
    address: 80
    device_id: ${device_id}
    register_type: holding
    value_type: U_WORD
    internal: true

  # Main sensor + fix
  - platform: template
    name: "${nameprefix}Total Energy Bought"
    id: "${prefix}total_energy_bought"
    device_id: ${device_id}
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    accuracy_decimals: 1
    icon: "mdi:transmission-tower-import"
    lambda: |-
      auto high = id(${prefix}total_energy_bought_high_bytes).state;
      auto low = id(${prefix}total_energy_bought_low_bytes).state;
      if (isnan(high) || isnan(low)) {
        return {}; 
      }
      float calculated_value = (((uint32_t)high << 16) | (uint32_t)low) * 0.1;
      unsigned long now = millis();
      if (id(${prefix}last_update_time) > 0 && (now - id(${prefix}last_update_time) > 3600000)) {
        id(${prefix}last_total_energy_bought) = calculated_value;
        id(${prefix}last_update_time) = now;
        return calculated_value;
      }
      if (isnan(id(${prefix}last_total_energy_bought)) || (calculated_value >= id(${prefix}last_total_energy_bought) && calculated_value < id(${prefix}last_total_energy_bought) + 1000.0)) {
        id(${prefix}last_total_energy_bought) = calculated_value;
        id(${prefix}last_update_time) = now;
        return calculated_value;
      }
      return {};

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Total Energy Sold"
    id: "${prefix}total_energy_sold"
    device_id: ${device_id}
    register_type: holding
    address: 81
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    accuracy_decimals: 1
    value_type: U_DWORD_R
    filters:
      - multiply: 0.1
    icon: "mdi:transmission-tower-export"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}External CT L1 Power"
    device_id: ${device_id}
    register_type: holding
    address: 170
    unit_of_measurement: "W"
    device_class: power
    accuracy_decimals: 0
    value_type: S_WORD
    icon: "mdi:transmission-tower"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}External CT L2 Power"
    device_id: ${device_id}
    register_type: holding
    address: 171
    unit_of_measurement: "W"
    device_class: power
    accuracy_decimals: 0
    value_type: S_WORD
    icon: "mdi:transmission-tower"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}External CT Power"
    device_id: ${device_id}
    register_type: holding
    address: 172
    unit_of_measurement: "W"
    device_class: power
    accuracy_decimals: 0
    value_type: S_WORD
    icon: "mdi:transmission-tower"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}External CT L1 Current"
    id: "${prefix}external_ct_l1_current"
    device_id: ${device_id}
    register_type: holding
    address: 162
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    value_type: S_WORD
    icon: "mdi:transmission-tower"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}External CT L2 Current"
    id: "${prefix}external_ct_l2_current"
    device_id: ${device_id}
    register_type: holding
    address: 163
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    value_type: S_WORD
    icon: "mdi:transmission-tower"

select:
  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Grid Frequency"
    device_id: ${device_id}
    address: 285
    value_type: U_WORD
    entity_category: config
    icon: "mdi:sine-wave"
    optionsmap:
      "50 Hz": 0
      "60 Hz": 1

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Charging Signal"
    device_id: ${device_id}
    address: 242
    value_type: U_WORD
    entity_category: config
    icon: "mdi:battery-charging"
    optionsmap:
      "Normal": 0
      "Grid": 1
      "Generator": 2
      "Both": 3

switch:
  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Force Off Grid"
    id: "${prefix}switch_off_grid"
    device_id: ${device_id}
    register_type: holding
    address: 281
    bitmask: 1
    entity_category: config
    icon: "mdi:transmission-tower-off"

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${nameprefix}Generator Grid Side"
    device_id: ${device_id}
    register_type: holding
    address: 280
    bitmask: 12
    entity_category: config
    icon: "mdi:generator-stationary"

number:
  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    id: "${prefix}grid_voltage_protection_high"
    name: "${nameprefix}Grid voltage protection - high"
    unit_of_measurement: "V"
    device_class: voltage
    entity_category: config
    device_id: ${device_id}
    register_type: holding    
    min_value: 100
    max_value: 290
    step: 1
    address: 287
    multiply: 10    
    value_type: U_WORD
    mode: box
    icon: "mdi:sine-wave"

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    id: "${prefix}grid_voltage_protection_low"
    name: "${nameprefix}Grid voltage protection - low"
    unit_of_measurement: "V"
    device_class: voltage
    entity_category: config
    device_id: ${device_id}
    register_type: holding
    min_value: 100
    max_value: 290
    step: 1
    address: 288
    multiply: 10    
    value_type: U_WORD
    mode: box
    icon: "mdi:sine-wave"

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    id: "${prefix}grid_requency_protection_high"
    name: "${nameprefix}Grid Frequency Protection - high"
    unit_of_measurement: "Hz"
    device_class: frequency
    entity_category: config
    device_id: ${device_id}
